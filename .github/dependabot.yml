version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels: ["dependencies", "security"]
    commit-message:
      prefix: "deps"
    groups:
      dev-dependencies:
        patterns: ["*"]
        dependency-type: "development"
      production-dependencies:
        patterns: ["*"]
        dependency-type: "production"
